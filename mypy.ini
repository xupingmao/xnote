[mypy]
# 增量代码需要通过 mypy 检查
# 运行方式: python -m mypy <改动的文件>, 例如 `python -m mypy xnote/webui/table.py`
# 注意: 项目运行时兼容 Python >= 3.6, 新增代码请勿使用 3.7+ 语法(如 from __future__ import annotations、内置泛型 dict[str, Any] 等)
ignore_missing_imports = True
# 仅检查指定文件本身,不把其它被导入模块的历史类型错误算进来
follow_imports = silent
show_error_codes = True
