{% init xnote_form_var = "form" %}
{% set _xnote_form = globals()[xnote_form_var] %}

{% render _xnote_form.action_bar %}

<div class="form-body {{_xnote_form.form_type_css}}">
    {# 表单的后端参数通过 data-* 传递给 _static/js/xnote-ui/x-form.js，
       这样弹窗注入的 HTML（<script> 不执行）也能正常工作 #}
    <form id="xnoteForm{{_xnote_form.id}}" class="x-form" method="{{_xnote_form.form_method}}"
        {% if _xnote_form.form_action %}action="{{_xnote_form.form_action}}"{% end %}
        data-form-path="{{_xnote_form.path}}"
        data-model-name="{{_xnote_form.model_name}}"
        data-save-action="{{_xnote_form.save_action}}"
        data-delete-reload-href="{{_xnote_form.delete_reload_href}}">
        {% for row in _xnote_form.rows %}
            <div class="form-row {{row.css_class}}">
                {% render row %}
            </div>
        {% end %}
    </form>
</div>

{% raw _xnote_form.render_footer() %}
