{% init show_right = True %}

{% if not show_menu %}
<style type="text/css">
  body {
    background: transparent;
  }

  .main {
    padding: 0px;
  }

  .nav {
    display: none;
  }

  .nav-left {
    display: none;
  }

  .x-body {
    left: 0px;
  }
</style>
{% end %}

{% if not show_search %}
<style type="text/css">
  .nav-left-search {
    display: none;
  }

  .search-box {
    display: none;
  }
</style>
{% end %}

{% if xconfig.DEBUG_HTML_BOX.get_bool() %}
<!-- 用于移动端或者其他不方便调试设备的样式调试 -->
<style type="text/css">
  * {
    box-sizing: border-box;
    border: solid 1px red;
  }
</style>
{% end %}

<style type="text/css" id="layout-css">
</style>


{% if _user_config.nav_style == "left" %}
<!-- 左侧菜单 -->
<style type="text/css" id="layout-css-left-nav">
  .nav-left {
    display: block;
  }

  @media screen and (min-width: 1000px) {
    .nav-left {
      width: 180px;
    }

    .x-center,
    .nav-container,
    .main-content {
      max-width: none;
      margin-left: 0;
      margin-right: 0;
      padding-left: 190px;
      padding-right: 10px;
    }
  }
</style>
{% else %}

<!-- 顶部菜单 -->
<style type="text/css">
  .nav-left {
    display: none;
  }
  .nav-container, .x-center, .main-content {
    padding-left: 40px;
    padding-right: 40px;
  }
</style>

{% end %}


<script type="text/javascript">
  // 仅保留设备信息计算与 resize 钩子（布局已由上方 CSS 处理）。
  // xnote.loadStyle 保留给 print.html 切换打印模式使用。
  (function () {
    function updateDevice() {
      var navStyle = "{{_user_config.nav_style}}";
      var contentWidth = parseInt("{{CONTENT_WIDTH}}");
      var winWidth = $(window).width();
      var leftNavWidth = 0;

      xnote.config.navStyle = navStyle;
      xnote.device.isMobile = winWidth < xnote.MOBILE_MAX_WIDTH;
      xnote.device.isDesktop = winWidth >= xnote.MOBILE_MAX_WIDTH;

      if (navStyle == "left" && xnote.isDesktop()) {
        leftNavWidth = 180;
        xnote.device.leftNavWidth = leftNavWidth;
        contentWidth = winWidth - leftNavWidth;
      }

      xnote.device.contentWidth = contentWidth;
      xnote.device.contentLeftWidth = (winWidth >= xnote.MOBILE_MAX_WIDTH)
        ? contentWidth - 300
        : winWidth;
    }

    function loadStyle() {
      updateDevice();

      if (xnote.config.isPrintMode) {
        // 进入打印模式：隐藏侧边栏、重置内容缩进（供屏幕预览与打印）
        document.body.className += " print-mode";
      }

      for (var i = 0; i < xnote.events.resizeHooks.length; i++) {
        xnote.events.resizeHooks[i]();
      }
    }

    loadStyle();
    xnote.loadStyle = loadStyle;

    $(window).on("resize", loadStyle);
  })();
</script>


{# 侧边栏(右侧)是否显示 #}
{% if not show_right %}
<style>
  .content-left {
    width: 100%;
  }
  .content-right {
    display: none;
  }
  .x-body {
    right: 0px;
  }
  .aside {
    display: none;
  }
</style>

{% end %}
