{% init _is_select2_loaded = False %}

{% if not _is_select2_loaded %} 
    {% set-global _is_select2_loaded = True %}
    <link rel="stylesheet" href="{{_server_home}}/_static/lib/select2/4.0.13/select2.min.css" type="text/css" />
    <script type="text/javascript" src="{{_server_home}}/_static/lib/select2/4.0.13/select2.min.js"></script>
    <script>
        // 把 select 的 value 属性同步到 option 的选中态
        // 说明: <select> 不支持 value 属性，只有 <option selected> 才算选中；
        // 而本函数可能早于 xnote.refresh() 里的 initSelect() 执行（jQuery ready
        // 回调按注册顺序执行，本片段通常位于表单 HTML 之前），若不先同步，
        // select2 会读到「没有选中项」从而渲染成空，后续再改 DOM 也不会同步。
        function syncSelectValue($elem) {
            var value = $elem.attr("value");
            if (value === undefined || value === null || value === "") {
                return;
            }
            var multiple = $elem.attr("multiple");
            var values = (multiple === "multiple") ? value.split(",") : [value];
            $elem.find("option").each(function (index, child) {
                if (values.indexOf(child.value) >= 0) {
                    child.selected = "selected";
                }
            });
        }

        xnote.initSelect2 = function () {
            // 只有大于等于10个选项时展示搜索
            $("select").each(function (index, elem) {
                var $elem = $(elem);
                // 已经初始化过的跳过，避免重复初始化
                if ($elem.hasClass("select2-hidden-accessible")) {
                    return;
                }
                var parent = $elem.parents(".layui-layer-content");
                if (parent.length == 0) {
                    parent = undefined;
                }
                if ($elem.attr("data-disable-select2")) {
                    return;
                }
                // select2默认支持 data-placeholder
                // https://select2.org/configuration/data-attributes

                // 初始化前先把 value 落到 option.selected，保证 select2 读到初始值
                syncSelectValue($elem);

                // 远程搜索（ajax）选择器：通过 data-select2-ajax-url 声明
                var ajaxUrl = $elem.attr("data-select2-ajax-url");
                if (ajaxUrl) {
                    var extraData = {};
                    var dataAttr = $elem.attr("data-select2-ajax-data");
                    if (dataAttr) {
                        try {
                            extraData = JSON.parse(dataAttr);
                        } catch (e) {
                            // 忽略非法的额外参数
                        }
                    }
                    $elem.select2({
                        dropdownParent: parent,
                        ajax: {
                            url: ajaxUrl,
                            data: function (params) {
                                var query = {
                                    search: params.term
                                };
                                for (var key in extraData) {
                                    if (extraData.hasOwnProperty(key)) {
                                        query[key] = extraData[key];
                                    }
                                }
                                return query;
                            }
                        }
                    });
                    return;
                }

                $elem.select2({
                    minimumResultsForSearch: 10,
                    dropdownParent:parent
                });
            })
        };
    
        $(function () {
            xnote.initSelect2();
        });
    </script>
{% end %}
