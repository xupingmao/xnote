{% init filter_html = "" %}
{% init filter_config_key = "task.filter" %}
<div class="card">
    <div class="split-title">
        <span class="bold">过滤器</span>
        <div class="float-right">
            [<a data-key="{{filter_config_key}}" onclick="xnoteEditFilter(this);">编辑</a>]
        </div>
    </div>
    <div class="padding-sm">
        {% raw filter_html %}
    </div>
</div>

<script>
xnote.state.codeEditDialogId = 0;
function xnoteEditFilter(target) {
    console.log(target);
    var configKey = $(target).attr("data-key");
    var url = "/message/tag/filter?action=edit&filter_config_key=" + encodeURIComponent(configKey);
    xnote.http.get(url, function (html) {
        xnote.state.codeEditDialogId = xnote.showDialog("编辑标签过滤器", html);
    });
}

// 处理编辑后的回调事件
xnote.on("message_tag.filter.save", function (event) {
    console.log("event=", event);
    xnote.closeDialog(xnote.state.codeEditDialogId);
    window.location.reload();
});
</script>
