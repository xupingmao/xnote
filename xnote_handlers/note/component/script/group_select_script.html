<!-- 移动单个笔记 -->
<style>
    .group-select-box {
        line-height: initial;
        font-weight: normal;
    }
</style>

<div class="group-select-box hide">
    <div class="dialog-body">
        <div class="group-select-search">
            <input id="groupSelectInput" type="text" class="nav-search-input" placeholder="搜索项目"/>
            <button class="nav-search-btn btn-default">
                <i class="fa fa-search"></i>
            </button>
        </div>
        <div class="group-select-data"></div>
    </div>
    <div class="dialog-footer">
        <div class="float-right">
            <button class="large btn-default" onclick="xnote.dialog.closeByElement(this)">关闭</button>
        </div>
    </div>
</div>

<script type="text/javascript">
    // 移动笔记-平铺模式
    xnote.api["note.move.dialog"] = NoteView.selectGroupFlat;

</script>
